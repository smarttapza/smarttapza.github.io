<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Download the Frontline App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #111111;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px 24px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: #555555;
      line-height: 1.5;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .android {
      background: #111111;
      color: #ffffff;
    }

    .iphone {
      background: #eeeeee;
      color: #111111;
    }

    .powered {
      margin-top: 25px;
      margin-bottom: 0;
      font-size: 12px;
      color: #888888;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Opening Frontline Groceries</h1>

    <p id="status">
      Please wait while we open the correct app for your phone.
    </p>

    <a id="androidButton" class="button android" href="#">
      Download for Android
    </a>

    <a id="iphoneButton" class="button iphone" href="#">
      Open on iPhone
    </a>

    <p class="powered">Powered by SmartTap</p>
  </main>

  <script>
    const ANDROID_URL =
      "https://play.google.com/store/apps/details?id=za.co.onthemoov.twa";

    const IPHONE_URL =
      "https://onthemoov.co.za/install";

    document.getElementById("androidButton").href = ANDROID_URL;
    document.getElementById("iphoneButton").href = IPHONE_URL;

    const userAgent = navigator.userAgent || navigator.vendor || "";

    const isAndroid = /android/i.test(userAgent);

    const isIOS =
      /iPhone|iPad|iPod/i.test(userAgent) ||
      (
        navigator.platform === "MacIntel" &&
        navigator.maxTouchPoints > 1
      );

    if (isAndroid) {
      setTimeout(function () {
        window.location.replace(ANDROID_URL);
      }, 600);
    } else if (isIOS) {
      setTimeout(function () {
        window.location.replace(IPHONE_URL);
      }, 600);
    } else {
      document.getElementById("status").textContent =
        "Choose the correct option for your device.";
    }
  </script>
</body>
</html>
